x-runtime: &runtime
  image: ${ARH_WORKFLOW_IMAGE:-arh-workflow:stage5-local}
  build:
    context: .
    dockerfile: Dockerfile.workflow
    target: runtime
    args:
      BASE_IMAGE: ${ARH_WORKFLOW_BASE_IMAGE:-python:3.12.14-slim-trixie@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f}
      SOURCE_REVISION: ${ARH_WORKFLOW_SOURCE_REVISION:-uncommitted}
      SOURCE_DIGEST: ${ARH_WORKFLOW_SOURCE_DIGEST:-unrecorded}
  init: true
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  healthcheck: {disable: true}
  tmpfs: ["/tmp:size=64m,mode=1777"]
  networks: [workflow]

x-environment: &environment
  ARH_WORKFLOW_DATABASE_URL: postgresql://arh@workflow-db:5432/arh_workflow
  PGPASSWORD: ${ARH_WORKFLOW_DB_PASSWORD:?Run scripts/configure_workflow.py}
  ARH_WORKFLOW_MODE: local
  API_BUDGET_USD: "0"

services:
  workflow-db:
    image: ${ARH_WORKFLOW_POSTGRES_IMAGE:-postgres:16.15-bookworm@sha256:e8a07d2c7579b038938cdba6c539e580e5001caf9ea203d397b5cc83e76bd938}
    environment:
      POSTGRES_USER: arh
      POSTGRES_DB: arh_workflow
      POSTGRES_PASSWORD: ${ARH_WORKFLOW_DB_PASSWORD:?Run scripts/configure_workflow.py}
    volumes:
      - workflow-db:/var/lib/postgresql/data
      - ./scripts/workflow_init.sql:/docker-entrypoint-initdb.d/010-tests.sql:ro
    networks: [workflow]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U arh -d arh_workflow"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *runtime
    command: ["arh", "jobs", "migrate"]
    environment: *environment
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      workflow-db: {condition: service_healthy}

  api:
    <<: *runtime
    networks: [workflow, ingress]
    ports: ["127.0.0.1:${ARH_WORKFLOW_API_PORT:-8091}:8091"]
    environment:
      <<: *environment
      ARH_WORKFLOW_AUTH_JSON: ${ARH_WORKFLOW_AUTH_JSON:?Run scripts/configure_workflow.py}
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/ready',timeout=2)"]
      interval: 2s
      timeout: 3s
      start_period: 15s
      retries: 30
    restart: unless-stopped

  worker-a:
    <<: *runtime
    command: ["arh", "jobs", "worker", "--worker-id", "worker-a", "--effects", "/reports/workflow-effects.sqlite"]
    environment: *environment
    volumes: [workflow-reports:/reports]
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  worker-b:
    <<: *runtime
    command: ["arh", "jobs", "worker", "--worker-id", "worker-b", "--effects", "/reports/workflow-effects.sqlite"]
    environment: *environment
    volumes: [workflow-reports:/reports]
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  checks:
    <<: *runtime
    image: ${ARH_WORKFLOW_CHECKS_IMAGE:-arh-workflow:stage5-checks-local}
    build:
      context: .
      dockerfile: Dockerfile.workflow
      target: checks
      args:
        BASE_IMAGE: ${ARH_WORKFLOW_BASE_IMAGE:-python:3.12.14-slim-trixie@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f}
        SOURCE_REVISION: ${ARH_WORKFLOW_SOURCE_REVISION:-uncommitted}
        SOURCE_DIGEST: ${ARH_WORKFLOW_SOURCE_DIGEST:-unrecorded}
    profiles: [checks]
    command: ["pytest", "-q", "-o", "cache_dir=/tmp/pytest-cache"]
    environment:
      <<: *environment
      ARH_WORKFLOW_TEST_DATABASE_URL: postgresql://arh@workflow-db:5432/arh_workflow_tests
    volumes: [workflow-reports:/reports]
    mem_limit: 768m
    cpus: 2.0
    depends_on:
      workflow-db: {condition: service_healthy}

networks:
  workflow:
    internal: true
  ingress: {}

volumes:
  workflow-db:
  workflow-reports:

