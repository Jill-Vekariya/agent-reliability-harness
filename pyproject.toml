[project]
name = "agent-reliability-harness"
version = "0.1.0"
description = "An offline-first, evidence-driven SQL agent reliability harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.14.1", "PyYAML==6.0.3", "openai==2.54.0",
  "streamlit==1.66.0", "matplotlib==3.11.2",
  "opentelemetry-sdk==1.45.1", "sqlglot==30.23.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "mypy==1.20.2", "types-PyYAML==6.0.12.20260906"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reliability"]

[project.scripts]
arh = "agent_reliability.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["matplotlib==3.11.2", "streamlit==1.66.0", "sqlglot==30.23.0"]
ignore_missing_imports = true
