name: Documentation links
on:
  pull_request:
    paths: ['**/*.md', 'scripts/check_links.py', '.github/workflows/links.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/check_links.py
