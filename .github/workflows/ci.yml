name: verify-and-release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 ref, 2026-10-18
        with:
          fetch-depth: 0
      - name: Install pinned tool and runtime
        run: |
          python3 -m pip install uv==0.12.23
          uv python install 3.12.14
          make setup
      - name: Verify current implementation
        run: make ci
      - name: Compare against target-branch baseline on PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:tests/regression/baseline.json" > "$RUNNER_TEMP/trusted-baseline.json"
          ARH_BASELINE_FILE="$RUNNER_TEMP/trusted-baseline.json" uv run --no-sync arh eval
      - name: Docker regression without networking
        run: |
          docker build -t agent-reliability-harness:ci .
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /reports:uid=10001,gid=10001,mode=1777 --memory 768m --cpus 2 --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges agent-reliability-harness:ci pytest
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /reports:uid=10001,gid=10001,mode=1777 --memory 768m --cpus 2 --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges agent-reliability-harness:ci arh eval
      - name: Build static walkthrough from validated synthetic traces
        run: uv run --no-sync python scripts/build_public_demo.py
  container:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # verified v3, 2026-10-18
      - name: Set image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # verified v6, 2026-10-18
        id: push
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
      - name: Record immutable image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published image \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
  pages:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the public walkthrough
        run: |
          python3 -m pip install uv==0.12.23
          uv python install 3.12.14
          make setup
          uv run --no-sync python scripts/build_public_demo.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # verified v3, 2026-10-18
        with:
          path: site
          retention-days: 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # verified v4, 2026-10-18
        id: deploy
