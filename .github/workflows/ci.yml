name: verify-and-release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7.0.1 / Node 24, 2026-10-18
        with:
          fetch-depth: 0
      - name: Install pinned tool and runtime
        run: |
          python3 -m pip install uv==0.12.23
          uv python install 3.12.14
          make setup
      - name: Verify current implementation
        run: make ci
      - name: Compare against target-branch baseline on PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:tests/regression/baseline.json" > "$RUNNER_TEMP/trusted-baseline.json"
          ARH_BASELINE_FILE="$RUNNER_TEMP/trusted-baseline.json" uv run --no-sync arh eval
      - name: Docker regression without networking
        run: |
          docker build -t agent-reliability-harness:ci .
          docker build -f Dockerfile.workflow --target checks -t arh-workflow-checks:ci .
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /reports:uid=10001,gid=10001,mode=1777 --memory 768m --cpus 2 --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges arh-workflow-checks:ci python -m pytest -q -o cache_dir=/tmp/pytest-cache
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /reports:uid=10001,gid=10001,mode=1777 --memory 768m --cpus 2 --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges agent-reliability-harness:ci arh eval
      - name: Build static walkthrough from validated synthetic traces
        run: uv run --no-sync python scripts/build_public_demo.py
  workflow-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:e8a07d2c7579b038938cdba6c539e580e5001caf9ea203d397b5cc83e76bd938
        env:
          POSTGRES_USER: arh
          POSTGRES_DB: arh_workflow_tests
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U arh -d arh_workflow_tests"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      # An ephemeral runner-local database only; no application credential is published.
      ARH_WORKFLOW_TEST_DATABASE_URL: postgresql://arh@127.0.0.1:5432/arh_workflow_tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the locked workflow test environment
        run: |
          python3 -m pip install uv==0.12.23
          uv python install 3.12.14
          make setup
      - name: Test real PostgreSQL and worker semantics
        run: uv run --no-sync pytest tests/integration/test_workflow_postgres.py tests/integration/test_workflow_deployment_postgres.py tests/unit/test_workflow.py tests/unit/test_workflow_controls.py -q --junitxml=workflow-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # resolved v4
        if: always()
        with:
          name: workflow-postgres-evidence
          path: workflow-tests.xml
  container:
    needs: [verify, workflow-postgres]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # verified v3, 2026-10-18
      - name: Set image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # verified v6, 2026-10-18
        id: push
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
      - name: Record immutable image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published image \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
  pages:
    needs: [verify, workflow-postgres]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the public walkthrough
        run: |
          python3 -m pip install uv==0.12.23
          uv python install 3.12.14
          make setup
          uv run --no-sync python scripts/build_public_demo.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # verified v5.0.0, 2026-10-18
        with:
          path: site
          retention-days: 1
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # verified v5.0.1 / Node 24, 2026-10-18
        id: deploy
